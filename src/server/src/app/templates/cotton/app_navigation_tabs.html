<c-vars target="#tab_content" />
<!--
The home page's tab bar: three daisyUI radio tabs that decide what the main
body region shows. Each radio carries its own hx-get and swaps the fetched
fragment into `target` (app/home.html's #tab_content) on change — a radio only
fires change when it becomes checked, so re-clicking the active tab fetches
nothing.

LISTEN and DESIGNER each return the same preserved mixer workspace. In its
normal card view HTMX moves that live element between their layouts, retaining
the mix and audio. A picker is transient and surface-specific, so changing tabs
while one is open removes the old workspace id: the incoming tab then mounts a
clean card rather than preserving the wrong picker.
-->
<!-- Explicit widths and a single flex row avoid daisyUI's radio-tab sizing bug
     in iOS WebKit. -->
<div class="tabs tabs-lift flex-nowrap">
    <input type="radio"
           name="home_tabs"
           class="tab w-auto"
           aria-label="ABOUT US"
           hx-get="{% url 'app:home_tab_about' %}"
           hx-target="{{ target }}"
           hx-swap="innerHTML" />
    <input type="radio"
           name="home_tabs"
           class="tab w-auto"
           aria-label="LISTEN"
           checked="checked"
           @change="window.CosoundSoundscape?.prepareWorkspaceTransfer()"
           hx-get="{% url 'app:home_tab_mixer' %}"
           hx-target="{{ target }}"
           hx-swap="innerHTML" />
    <input type="radio"
           name="home_tabs"
           class="tab w-auto"
           aria-label="DESIGNER"
           @change="window.CosoundSoundscape?.prepareWorkspaceTransfer()"
           hx-get="{% url 'studio:initial' %}"
           hx-target="{{ target }}"
           hx-swap="innerHTML" />
</div>
