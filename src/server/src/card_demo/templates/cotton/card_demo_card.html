<c-vars sounds />
<div class="h-full w-full"
     data-card-demo
     data-light-mode="true"
     aria-hidden="true"
     inert>
    <c-core-deck>
        <c-core-card showExit="false" bgColor="bg-[#1f3f23]" ringColor="ring-[#2d2d2d]">
            {% if sounds %}
            <div data-card-demo-media class="relative shrink-0">
                <figure data-card-demo-artwork-frame class="relative aspect-square w-full rounded-t-md bg-base-300 ring-7 ring-neutral-content/70">
                    <div data-card-demo-header
                        class="absolute top-0 z-30 flex -translate-y-1/2 overflow-hidden rounded-md bg-white ring-4 ring-neutral-content/70"
                        :class="indicatorCentered ? 'left-1/2 -translate-x-1/2' : 'left-4'">
                        <div data-card-demo-indicator
                            class="flex h-8 min-w-0 max-w-full items-center justify-center overflow-hidden bg-slate-700/75 px-2 text-center font-semibold text-white"
                            :style="`font-size: ${indicatorTextSize}px; letter-spacing: ${indicatorTextSpacing}px`">
                            <span data-card-demo-indicator-text
                                class="block min-w-0 max-w-full truncate"
                                :title="indicatorText || null"
                                x-text="indicatorText"></span>
                        </div>
                    </div>
                    <div data-card-demo-artwork-viewport class="absolute inset-0 overflow-hidden rounded-t-md">
                        <div data-card-demo-figure class="h-full w-full">
                            <div class="relative h-full w-full">
                                <template x-if="uploadedArtworkUrl">
                                    <img data-card-demo-uploaded-artwork
                                        :src="uploadedArtworkUrl"
                                        :alt="artworkTitle || uploadedArtworkName || 'Uploaded artwork'"
                                        class="absolute inset-0 h-full w-full object-cover object-center" />
                                </template>
                                <div x-show="!uploadedArtworkUrl"
                                    data-card-demo-carousel @scroll.debounce.5ms="updateActive($event.currentTarget)"
                                    class="carousel h-full w-full">
                                    <template x-for="layer in layers" :key="layer.sound_id">
                                        <div data-card-demo-layer
                                            class="carousel-item relative h-full w-full transition-[filter] duration-300 ease-out"
                                            :style="`filter: grayscale(${grayscaleFor(layer)}%)`">
                                            <template x-if="layer.artwork_url">
                                                <c-core-image bind_src="layer.artwork_url" bind_alt="layer.sound_title"
                                                    class="h-full w-full" />
                                            </template>
                                            <div x-show="!layer.artwork_url"
                                                data-card-demo-artwork
                                                class="h-full w-full"
                                                aria-hidden="true"></div>
                                        </div>
                                    </template>
                                </div>
                                <div x-show="showArtworkText"
                                    style="display: none"
                                    data-card-demo-artwork-text
                                    class="pointer-events-none absolute inset-0 z-20 flex flex-col justify-between bg-gradient-to-b from-black/65 via-transparent to-black/65 p-3 pt-8 font-serif italic text-white text-shadow-lg">
                                    <p class="break-words pr-10 text-left leading-tight"
                                        :style="`font-size: ${artworkTextSize}px`"
                                        x-text="artworkTitle"></p>
                                    <p class="max-w-full break-words self-end pb-1 pr-1 text-right opacity-90"
                                        :style="`font-size: ${Math.max(8, artworkTextSize * 0.72)}px`"
                                        x-text="artistName"></p>
                                </div>
                                <div x-show="showLikeButton"
                                    style="display: none"
                                    data-card-demo-like
                                    class="absolute top-6.5 right-3 z-30 grid size-8 place-items-center rounded-full bg-black/30 text-white shadow-md backdrop-blur-sm">
                                    <svg data-card-demo-like-icon class="fill-red-500 text-red-500 drop-shadow-md" xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor"
                                        aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button x-show="showLeftArrow" data-card-demo-side-arrow="left" type="button" @click="move(-1)" aria-label="Previous carousel panel"
                    class="absolute top-1/2 z-10 flex aspect-square cursor-pointer items-center justify-center text-amber-600 stroke-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-full w-full" viewBox="0 -960 960 960"
                        fill="currentColor">
                        <path d="M560-280 360-480l200-200v400Z" stroke-width="40" stroke-linejoin="round" />
                    </svg>
                    </button>
                    <button x-show="showRightArrow" data-card-demo-side-arrow="right" type="button" @click="move(1)" :disabled="isLast" aria-label="Next carousel panel"
                    class="absolute top-1/2 z-10 flex aspect-square cursor-pointer items-center justify-center text-amber-600 stroke-white disabled:cursor-not-allowed disabled:text-neutral-600 disabled:stroke-neutral-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-full w-full" viewBox="0 -960 960 960"
                        fill="currentColor">
                        <path d="M400-280v-400l200 200-200 200Z" stroke-width="40" stroke-linejoin="round" />
                    </svg>
                    </button>
                </figure>
            </div>
            <div data-card-demo-slider-row class="z-20 flex flex-row items-center justify-center">
                <div class="tooltip tooltip-right z-30 shrink-0"
                    :data-tip="currentLayer?.mute ? 'Unmute this layer' : 'Mute this layer'">
                    <button data-card-demo-slider-control type="button" :aria-label="currentLayer?.mute ? 'Unmute this layer' : 'Mute this layer'"
                        :aria-pressed="Boolean(currentLayer?.mute)"
                        class="btn btn-xs btn-circle border-none bg-neutral-content text-white focus:outline-none"
                        :class="isSilenced(currentLayer) ? '!bg-amber-500 !text-amber-900' : ''"
                        @click="toggleMute(currentLayer)">
                        <!-- Broken heart: Noto Emoji artwork (googlefonts/noto-emoji, Apache 2.0). The viewBox is
                        trimmed to the drawing's own edges, so the button's centering centers the art. -->
                        <svg data-card-demo-slider-emoji xmlns="http://www.w3.org/2000/svg" viewBox="4 8.96 120 106.33" aria-hidden="true">
                            <path fill="#f44336" d="M93.96,8.96c-10.01,0-17.79,6.18-22.76,13.12c-5.57,7.77-11.05,20.8-13.12,25.96c-0.54,1.35-0.28,2.88,0.67,3.98l13.65,15.85c0.43,0.5,0.49,1.21,0.17,1.78L61.17,89.34c-0.43,0.75-0.54,1.63-0.31,2.46l6.26,22.43c0.28,0.99,1.46,1.38,2.27,0.75c13.33-10.44,47.44-39.08,53.04-63.02C129.41,22.1,111.87,8.96,93.96,8.96z" />
                            <path fill="#f44336" d="M63.55,68.35L48.94,51.37l10.93-23.2c0.79-1.68,0.65-3.67-0.42-5.19C54.97,16.62,46.9,8.96,33.99,8.96c-16.58,0-35.48,13.14-28.5,43.01c5.39,23.06,37.71,51.36,52.02,62.68c0.36,0.29,0.9,0.05,0.93-0.42l0.61-7.11l-6.09-17.57l10.83-18.74C64.24,70.03,64.15,69.04,63.55,68.35z" />
                            <path fill="#cc3333" d="M93.96,8.96c-6.63,0-12.27,2.72-16.77,6.56c0,0,0,0,0,0c0.81-0.59,6.11-4.33,12.05-4.33c16.21,0,30.72,12.29,24.17,40.7c-5.24,22.72-34.09,49.96-46.12,62.7c0.43,0.71,1.41,0.94,2.11,0.39c13.33-10.44,47.44-39.08,53.04-63.02C129.41,22.1,111.87,8.96,93.96,8.96z" />
                            <path fill="#ff8a80" d="M77.13,34.65c-1.76,0-3-1.7-2.36-3.34c1.19-3.02,2.73-5.94,4.58-8.54c2.74-3.84,7.95-6.08,11.25-3.75c3.38,2.38,2.94,7.14,0.57,9.44C86.07,33.39,79.66,34.65,77.13,34.65z" />
                            <path fill="#ff8a80" d="M17,24.82c3.75-4.68,10.45-8.55,16.13-4.09c3.07,2.41,1.73,7.35-1.02,9.43c-4,3.04-7.48,4.87-9.92,9.63c-1.46,2.86-2.34,5.99-2.79,9.18c-0.18,1.26-1.83,1.57-2.45,0.46C12.73,41.94,11.53,31.64,17,24.82z" />
                            <path fill="#cc3333" d="M52.96,89.55l10.83-18.74c0.46-0.79,0.36-1.78-0.23-2.47L48.94,51.37L60.59,27.1c0.79-1.68,0.65-3.67-0.42-5.19C55.69,15.55,46.9,8.96,33.99,8.96c-10.02,0-20.89,4.81-26.38,15.22c5.92-7.45,15.06-10.94,23.59-10.94c12.91,0,20.98,7.66,25.46,14.02c1.07,1.52,1.21,3.51,0.42,5.19l-10.93,23.2l14.62,16.98c0.59,0.69,0.69,1.68,0.23,2.47L50.17,93.83c0,0,5.91,15.8,8.1,20.7c0,0,0.17,0,0.3-0.85c0,0,0.88-6.25,0.4-7.74C58.52,104.52,52.96,89.55,52.96,89.55z" />
                        </svg>
                    </button>
                </div>
                <div data-card-demo-slider-track-shell class="min-w-0 flex-1 touch-none select-none" x-data="{ dragging: false }"
                    @pointermove.window="if (dragging) setGainFromPointer($event, $refs.track)"
                    @pointerup.window="dragging = false" @pointercancel.window="dragging = false">
                    <div data-card-demo-volume-track x-ref="track" role="slider" tabindex="0" aria-label="Current layer volume" aria-valuemin="0"
                        aria-valuemax="100" :aria-valuenow="Math.round(currentLayer?.gain ?? 0)"
                        class="relative h-2 w-full cursor-pointer rounded-full bg-amber-500 transition-[filter]"
                        :class="isSilenced(currentLayer) ? 'grayscale' : ''"
                        @pointerdown="dragging = true; setGainFromPointer($event, $refs.track)"
                        @keydown.left.prevent="stepGain(-5)" @keydown.down.prevent="stepGain(-5)"
                        @keydown.right.prevent="stepGain(5)" @keydown.up.prevent="stepGain(5)">
                        <div x-show="showBottomArrow"
                            data-card-demo-bottom-arrow
                            class="pointer-events-none absolute top-1/2 flex aspect-square items-center justify-center transition-[filter,opacity] duration-300"
                            :class="isSilenced(currentLayer) ? 'grayscale' : ''"
                            :style="`left: ${bottomArrowValue}%`">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"
                                class="pointer-events-none h-full w-full rotate-90 text-amber-600 stroke-white drop-shadow-md"
                                fill="currentColor">
                                <path d="M400-280v-400l200 200-200 200Z" stroke-width="40" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="tooltip tooltip-left z-30 shrink-0"
                    :data-tip="currentLayer?.isolated ? 'Stop isolating this layer' : 'Isolate this layer'">
                    <button data-card-demo-slider-control type="button"
                        :aria-label="currentLayer?.isolated ? 'Stop isolating this layer' : 'Isolate this layer'"
                        :aria-pressed="Boolean(currentLayer?.isolated)"
                        class="btn btn-xs btn-circle shrink-0 border-none bg-neutral-content text-white focus:outline-none"
                        :class="currentLayer?.isolated ? '!bg-amber-500 !text-amber-900' : ''"
                        @click="toggleIsolate(currentLayer)">
                        <!-- Red heart: Noto Emoji artwork (googlefonts/noto-emoji, Apache 2.0). The viewBox is
                        trimmed to the drawing's own edges, so the button's centering centers the art. -->
                        <svg data-card-demo-slider-emoji xmlns="http://www.w3.org/2000/svg" viewBox="4.04 8.97 120 110.09" aria-hidden="true">
                            <path fill="#f44336" d="M93.99,8.97c-21.91,0-29.96,22.39-29.96,22.39S56.09,8.97,34.03,8.97c-16.58,0-35.48,13.14-28.5,43.01c6.98,29.87,58.56,67.08,58.56,67.08s51.39-37.21,58.38-67.08C129.45,22.11,111.91,8.97,93.99,8.97z" />
                            <path fill="#cc3333" d="M30.65,11.2c17.2,0,25.74,18.49,28.5,25.98c0.39,1.07,1.88,1.1,2.33,0.06L64,31.35C60.45,20.01,50.69,8.97,34.03,8.97c-6.9,0-14.19,2.28-19.86,7.09C19.18,12.77,25.05,11.2,30.65,11.2z" />
                            <path fill="#cc3333" d="M93.99,8.97c-5.29,0-10.11,1.15-13.87,3.47c2.64-1.02,5.91-1.24,9.15-1.24c16.21,0,30.72,12.29,24.17,40.7c-5.62,24.39-38.46,53.98-48.49,65.27c-0.64,0.72-0.86,1.88-0.86,1.88s51.39-37.21,58.38-67.08C129.45,22.11,111.94,8.97,93.99,8.97z" />
                            <path fill="#ff8a80" d="M17.04,24.82c3.75-4.68,10.45-8.55,16.13-4.09c3.07,2.41,1.73,7.35-1.02,9.43c-4,3.04-7.48,4.87-9.92,9.63c-1.46,2.86-2.34,5.99-2.79,9.18c-0.18,1.26-1.83,1.57-2.45,0.46C12.77,41.95,11.57,31.65,17.04,24.82z" />
                            <path fill="#ff8a80" d="M77.16,34.66c-1.76,0-3-1.7-2.36-3.34c1.19-3.02,2.73-5.94,4.58-8.54c2.74-3.84,7.95-6.08,11.25-3.75c3.38,2.38,2.94,7.14,0.57,9.44C86.11,33.4,79.69,34.66,77.16,34.66z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div data-card-demo-flavor-box
                class="relative min-h-0 flex-1 overflow-hidden rounded-xs rounded-b-2xl bg-white/65 text-black ring-5 ring-amber-600/60">
                <div class="relative h-full overflow-hidden px-4 py-2">
                    <div data-card-demo-body class="h-full w-full overflow-hidden whitespace-pre-wrap break-words font-serif italic" aria-label="Flavor text area"
                        :style="`font-size: ${flavorTextSize}px`"
                        x-text="flavorText"></div>
                    <template x-if="flavorOverlayUrl">
                        <div data-card-demo-flavor-overlay-shell class="pointer-events-none absolute inset-0 z-10">
                            <img data-card-demo-flavor-overlay
                                :src="flavorOverlayUrl"
                                alt=""
                                class="absolute inset-0 h-full w-full object-contain" />
                            <div data-card-demo-flavor-overlay-tint
                                aria-hidden="true"
                                :style="flavorOverlayTintStyle"
                                class="absolute inset-0"></div>
                        </div>
                    </template>
                </div>
            </div>
            <div data-card-demo-master-shell
                class="absolute bottom-0 left-1/2 z-10 flex w-fit -translate-x-1/2 justify-center overflow-hidden rounded-t-2xl bg-[#f3f4f6] ring-6 ring-[#2d2d2d]/60 drop-shadow-2xl">
                <div data-card-demo-master
                    class="flex h-8 w-[13.25rem] items-center justify-center px-3"
                    style="color: #2d2d2d">
                    <span data-card-demo-master-text
                        class="block w-full truncate text-center font-bold uppercase"
                        :style="`font-size: ${masterTextSize}px; letter-spacing: ${masterTextSpacing}px; font-stretch: normal`"
                        :title="masterText || null"
                        x-text="masterText"></span>
                </div>
            </div>
            {% else %}
            <div class="grid min-h-96 place-items-center px-8 text-center text-white">
                <p class="font-serif italic">Add sounds to the collection to populate this card.</p>
            </div>
            {% endif %}
        </c-core-card>
    </c-core-deck>
</div>
