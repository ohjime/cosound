<c-vars swap_url="" />
<!--
The face of a blank layer — one the `+` button made room for, before a sound has
been chosen for it. c-core-sound-carousel draws this in place of the artwork
whenever `layer.isDraft`.

`swap_url` is what the card does when it is pressed, and it is the one thing the
two surfaces disagree about:

  library — pass the library's swap route. Pressing the card then does what the
           Swap button does: point currentIndex at this layer, raise
           `swappingLayer`, and fetch the picker over the card. Choosing a sound
           runs the ordinary replacement flow, which clears the blank flag on
           the way through.
  studio — pass nothing. The card there is a readout, not a control: every
           change is made in the settings pane on the left, and this layer is
           already the selected one, so the panel is showing its Add file /
           Library buttons as the card is read.

Inert is `disabled` on the same button rather than a second element, so the two
states cannot drift apart. Nothing here binds a sound id — a blank layer has
none — so there is no request to guard beyond the button itself.

A mix mounted with `allow_create` (the home page's STUDIO tab) asks a second
question instead of opening the picker on a press: fill this layer from the
library, or create a new sound here. Library is the same request the library's
face makes. Create turns the layer into a new sound (`createSound` in
soundscape-store.js) — still blank underneath, but with fields on the card for
its title, artist, story and tags — and the galaxy fades to white and grey to
say the layer has stopped being empty and started being written. That fade is
a `filter` transition on the galaxy rather than a second set of gradients:
gradients do not interpolate, a filter does, so the swirl keeps turning while
its colour drains out.
-->
<div class="absolute inset-0 z-10 overflow-hidden">
    <!-- Layered gradients make the dark galaxy, stars, spiral arms, and event
         horizon. They are CSS-only and become still artwork for reduced motion. -->
    <span aria-hidden="true"
          class="empty-layer-galaxy pointer-events-none"
          :class="layer.isNew && 'empty-layer-galaxy--new'">
        <span class="empty-layer-galaxy__sludge"></span>
        <span class="empty-layer-galaxy__disc"></span>
        <span class="empty-layer-galaxy__core"></span>
    </span>
    <template x-if="!$store.soundLayers.allowCreate">
        <button type="button"
                class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-8 text-center text-white transition-colors duration-300 enabled:cursor-pointer enabled:hover:text-amber-300"
                {% if swap_url %}
                    hx-get="{{ swap_url }}"
                    hx-swap="none swap:300ms"
                    x-init="$nextTick(() => htmx.process($el))"
                    hx-on:htmx:before-swap="document.querySelectorAll('#card-figure, #card-body').forEach(el => el.classList.add('htmx-swapping'))"
                    @click="$store.soundLayers.currentIndex = index; $store.soundLayers.swappingLayer = true"
                {% else %}
                    disabled
                {% endif %}>
            <span class="relative z-10 flex size-20 items-center justify-center rounded-full border-2 border-current bg-black/35 px-2 text-base leading-tight opacity-90 shadow-lg backdrop-blur-sm transition">
                Empty Layer
            </span>
            <span class="relative z-10 rounded-full bg-black/40 px-4 py-2 text-sm tracking-wide shadow-md backdrop-blur-sm transition">
                {% if swap_url %}
                    Press here to add a sound
                {% else %}
                    Choose a sound in the panel
                {% endif %}
            </span>
        </button>
    </template>
    <!-- Create mode. x-show rather than x-if on the new-sound state so the
         choices fade out alongside the galaxy instead of vanishing under it. -->
    <template x-if="$store.soundLayers.allowCreate">
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-6 text-center text-white"
             x-show="!layer.isNew"
             x-transition:leave="transition-opacity duration-500"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            <span class="flex size-20 items-center justify-center rounded-full border-2 border-current bg-black/35 px-2 text-base leading-tight opacity-90 shadow-lg backdrop-blur-sm">
                Empty Layer
            </span>
            <div class="flex flex-col items-stretch gap-2">
                <button type="button"
                        class="btn btn-sm rounded-full border-white/40 bg-black/40 text-white shadow-md backdrop-blur-sm hover:border-amber-300 hover:text-amber-300"
                        hx-get="{{ swap_url }}"
                        hx-swap="none swap:300ms"
                        x-init="$nextTick(() => htmx.process($el))"
                        hx-on:htmx:before-swap="document.querySelectorAll('#card-figure, #card-body').forEach(el => el.classList.add('htmx-swapping'))"
                        @click="$store.soundLayers.currentIndex = index; $store.soundLayers.swappingLayer = true">
                    Use a sound from your library
                </button>
                <button type="button"
                        class="btn btn-sm rounded-full border-white/40 bg-white/85 text-neutral-900 shadow-md backdrop-blur-sm hover:bg-white"
                        @click="$store.soundLayers.currentIndex = index; $store.soundLayers.createSound(index)">
                    Create a new sound
                </button>
            </div>
        </div>
    </template>
</div>
