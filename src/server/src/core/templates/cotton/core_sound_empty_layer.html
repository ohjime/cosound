<c-vars swap_url="" />
<!--
The face of a blank layer — one the `+` button made room for, before a sound has
been chosen for it. c-core-sound-carousel draws this in place of the artwork
whenever `layer.isDraft` — except a new sound (`layer.isNew`), which has a face
of its own.

`swap_url` is what the card does when it is pressed:

  library — pass the library's swap route. Pressing the card then does what the
           Swap button does: point currentIndex at this layer, raise
           `swappingLayer`, and fetch the picker over the card. Choosing a sound
           runs the ordinary replacement flow, which clears the blank flag on
           the way through.
  anywhere else — pass nothing, and the face is a readout. An Explore post's
           card never holds a blank layer, but if one reached it there would be
           no picker to open, so the button stays inert rather than offer one.

Inert is `disabled` on the same button rather than a second element, so the two
states cannot drift apart. Nothing here binds a sound id — a blank layer has
none — so there is no request to guard beyond the button itself.

A mix mounted with `allow_create` (the home page's LIBRARY tab, for a signed-in
artist) asks a second question instead of opening the picker on a press: fill
this layer from the library, or create a new sound here. Library is the same
request the library's face makes. Create is the same card swap a library pick
makes — the card fades out, `library:carousel` brings it back — and the layer
turns into a new sound (`createSound` in soundscape-store.js) while the card is
out of sight. What returns is not this face but c-core-sound-new-layer:
stand-in artwork carrying the uploads, with fields on the card for its title,
artist, story and tags.
-->
<div class="absolute inset-0 z-10 overflow-hidden">
    <!-- Layered gradients make the dark galaxy, stars, spiral arms, and event
         horizon. They are CSS-only and become still artwork for reduced motion. -->
    <span aria-hidden="true" class="empty-layer-galaxy pointer-events-none">
        <span class="empty-layer-galaxy__sludge"></span>
        <span class="empty-layer-galaxy__disc"></span>
        <span class="empty-layer-galaxy__core"></span>
    </span>
    <template x-if="!$store.soundLayers.allowCreate">
        <button type="button"
            class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-8 text-center text-white transition-colors duration-300 enabled:cursor-pointer enabled:hover:text-amber-300"
            {% if swap_url %} hx-get="{{ swap_url }}" hx-swap="none swap:300ms"
            x-init="$nextTick(() => htmx.process($el))"
            hx-on:htmx:before-swap="document.querySelectorAll('#card-figure, #card-body').forEach(el => el.classList.add('htmx-swapping'))"
            @click="$store.soundLayers.currentIndex = index; $store.soundLayers.swappingLayer = true" {% else %}
            disabled {% endif %}>
            <span
                class="relative z-10 flex size-20 items-center justify-center rounded-full border-2 border-current bg-black/35 px-2 text-base leading-tight opacity-90 shadow-lg backdrop-blur-sm transition">
                Empty Layer
            </span>
            <span
                class="relative z-10 rounded-full bg-black/40 px-4 py-2 text-sm tracking-wide shadow-md backdrop-blur-sm transition">
                {% if swap_url %}
                Press here to add a sound
                {% else %}
                No sound here yet
                {% endif %}
            </span>
        </button>
    </template>
    <!-- Create mode: Empty Layer offers the library or Create.

         Create swaps the card exactly as a library pick does — fade
         #card-figure and #card-body out, fetch `library:carousel`, let both
         come back with their entrance — so a new sound lands the way a
         library sound does. The one difference is when the layer changes.
         A pick's layer changes while the card is being swapped, under the
         Adding Track screen; a new sound has nothing to load, so it would flip
         on the card still fading out. createSound therefore runs inside the
         swap itself, on #card-figure's htmx:oobBeforeSwap, once the card has
         faded and just before its replacement goes in. `swappingLayer` holds
         the arrows and the indicator still until then, the same as it does for
         a pick.

         Not any earlier. createSound makes this face give way to the new
         sound's, and that takes this button out of the page with it. htmx
         looks the out-of-band targets up from the root of the element that
         made the request, when the swap starts rather than when the response
         arrives, so a button already gone by then finds neither #card-figure
         nor #card-body (htmx:oobErrorNoTarget) and the card never comes back.
         By oobBeforeSwap the lookup has been done against the document.

         The fade and the listener are Alpine's @htmx:before-swap rather than
         hx-on, because createSound needs this layer's `index`, which only
         Alpine's scope has. -->
    <template x-if="$store.soundLayers.allowCreate">
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-6 text-center">
            <span
                class="grid size-20 place-items-center rounded-full border-2 border-white bg-black/35 px-2 text-base leading-tight text-white opacity-90 shadow-lg backdrop-blur-sm">
                Empty Layer
            </span>
            <div class="flex flex-col items-stretch gap-2">
                <button type="button"
                    class="btn btn-sm rounded-full border-white/40 bg-black/40 text-white shadow-md backdrop-blur-sm hover:border-amber-300 hover:text-amber-300"
                    hx-get="{{ swap_url }}" hx-swap="none swap:300ms" x-init="$nextTick(() => htmx.process($el))"
                    hx-on:htmx:before-swap="document.querySelectorAll('#card-figure, #card-body').forEach(el => el.classList.add('htmx-swapping'))"
                    @click="$store.soundLayers.currentIndex = index; $store.soundLayers.swappingLayer = true">
                    Use a sound from your library
                </button>
                <button type="button"
                    class="btn btn-sm rounded-full border-white/40 bg-white/85 text-neutral-900 shadow-md backdrop-blur-sm hover:bg-white"
                    hx-get="{% url 'library:carousel' %}" hx-swap="none swap:300ms"
                    x-init="$nextTick(() => htmx.process($el))"
                    @click="$store.soundLayers.currentIndex = index; $store.soundLayers.swappingLayer = true"
                    @htmx:before-swap="if (!$event.detail.shouldSwap) return; const i = index; document.querySelectorAll('#card-figure, #card-body').forEach(el => el.classList.add('htmx-swapping')); const store = $store.soundLayers; document.body.addEventListener('htmx:oobBeforeSwap', function create(e) { if (e.target.id !== 'card-figure') return; document.body.removeEventListener('htmx:oobBeforeSwap', create); store.createSound(i) })"
                    @htmx:after-request="$event.detail.successful || ($store.soundLayers.swappingLayer = false)">
                    Create a new sound
                </button>
            </div>
        </div>
    </template>
</div>
