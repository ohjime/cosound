<!--
An image figure that behaves like the ones on Anthropic's research posts:
full reading-column width (breaking out to an 800px media column on large
screens), rounded image, and the caption bottom-left underneath in their
14px sans caption style.

    < c-figure src="/static/img/readouts.png" caption="What the figure shows." />

`alt` falls back to the caption when not given. Like c-youtube-video, the
lg: breakout assumes the component sits inside the article's 640px reading
column — anywhere else, wrap it in a max-w-160 container or the negative
margins will overflow.
-->
<c-vars src="" caption="" alt="" />
<figure class="w-full my-6 lg:my-24 lg:w-[calc(100%+10rem)] lg:-mx-20 flex flex-col">
    <img class="block w-full h-auto rounded-lg sm:rounded-xl" src="{{ src }}" alt="{% if alt %}{{ alt }}{% else %}{{ caption }}{% endif %}" loading="lazy" />
    {% if caption %}
        <figcaption class="mt-2 w-full font-sans text-[14px] leading-[120%] tracking-[0.15px] text-base-content/60">{{ caption }}</figcaption>
    {% endif %}
</figure>
