<!--
The card's flavor panel: the layer's tags over its story.

A new sound (an artist's Create on the home page's LIBRARY tab) has no tags or
story yet — they are the artist's to write — so the panel becomes the fields
for them instead, c-studio-new-sound-details. Both the card and the picker's
way back (`library:carousel`, #default_view) render this, which is what keeps
the fields in place after a trip through the picker.
-->
<template x-if="!$store.soundLayers.currentLayer?.isNew">
    <div class="italic font-serif font-extralight text-[8pt] font-stretch-95%">
        <p class="py-1 not-italic font-bold font-serif text-xs font-stretch-95%"
           x-text="'[ ' + $store.soundLayers.currentLayer?.tags + ' ]'"></p>
        <span x-text="$store.soundLayers.currentLayer?.flavor"></span>
    </div>
</template>
<template x-if="$store.soundLayers.currentLayer?.isNew">
    <c-studio-new-sound-details />
</template>
