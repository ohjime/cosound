<div class="podcast-stash">
    <button type="button" class="podcast-launch" x-ref="podcastLaunch" @click="toggleDrawer()"
            :aria-expanded="open" aria-controls="podcast-drawer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <rect x="4" y="8" width="16" height="12" rx="3" />
            <path d="m6 8 11-5M7 12h10M7 16h5" /><circle cx="16" cy="16" r="1" />
        </svg>
        <span>Podcast Stash</span>
        <span class="podcast-launch-count" x-show="queue.length" x-text="queue.length"></span>
        <span class="podcast-launch-arrow" x-text="open ? '−' : '+'" aria-hidden="true">+</span>
    </button>
    <p class="podcast-collapsed-status" x-show="!open && (status.playing || status.loading)" x-cloak>
        <span x-text="status.loading ? 'Connecting to your podcast…' : 'Still playing alongside your Cosound'"></span>
    </p>
</div>
