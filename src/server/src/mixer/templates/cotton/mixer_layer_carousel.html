<c-vars name="soundLayers" artist_url="" swap_url="" />
<!--
`artist_url` is passed in rather than reversed here, because this component is
shared across urlconfs. The url tag resolves against the *per-request* urlconf
(see config.middleware.SubdomainURLConf), and the studio host mounts only
studio + login — reversing `app:artist_details` in here would blow up the studio
with NoReverseMatch. Callers that have the route pass it; the studio does not,
and the artist name renders as plain text.

`swap_url` rides along for the same reason and reaches c-mixer-empty-layer,
which is what a blank layer looks like on the card. The mixer passes its swap
route so pressing the empty card opens the sound picker; the studio passes
nothing, because there the card is a readout and the settings pane fills the
layer in.

The behaviour is not here: vite/assets/js/layer-carousel.js has what a jump is,
what a swipe is, and why the selection must not walk the layers in between. This
file is the wiring and the caption.
-->
<div class="relative w-full h-full"
     x-data="layerCarousel('{{ name }}')"
     x-init="$nextTick(() => start())"
     @carousel-prev.window="move(-1)"
     @carousel-next.window="move(1)"
     @carousel-goto.window="select($event.detail)">
    <!-- Barely debounced on purpose: a swipe *is* the selection, so the pill and
         the studio's tab strip should track the finger rather than catch up
         after it. A jump does not walk the layers in between because
         updateActive() ignores the animation, not because this handler is slow.
         The three release() handlers are how a hand on the artwork cuts a jump
         short: whatever it was flying to, the swipe now decides. -->
    <div x-ref="carousel"
         @scroll.debounce.5ms="updateActive()"
         @pointerdown="release()"
         @touchstart.passive="release()"
         @wheel.passive="release()"
         class="carousel w-full h-full">
        <!-- A blank layer has no artwork to show, so it gets its own face
             instead. Both branches are x-if rather than x-show: c-core-image
             would otherwise start loading a placeholder nobody sees, and the
             empty card's htmx attributes would sit armed behind it. -->
        <template x-for="(layer, index) in $store.{{ name }}.layers" :key="layer.sound_id">
            <div class="carousel-item relative h-full w-full transition-[filter] duration-300 ease-out" :style="`filter: grayscale(${$store.{{ name }}.grayscaleFor(layer)}%)`">
                <template x-if="layer.isDraft">
                    <c-mixer-empty-layer swap_url="{{ swap_url }}" />
                </template>
                <template x-if="!layer.isDraft">
                    <div class="contents">
                        <c-core-image bind_src="layer.artwork_url" bind_alt="layer.sound_title" class="w-full" />
                        <div class="pointer-events-none absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-black/80 to-transparent z-10">
                        </div>
                        <div class="pointer-events-none absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-black/60 to-transparent z-10">
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
    <!-- The caption reads the store rather than a copy taken when the carousel
         last settled, so the studio's title field edits it as it is typed. -->
    <div class="pointer-events-none absolute inset-0 z-20 p-3 pt-8 font-serif italic flex flex-col justify-between text-white font-thin text-shadow-lg">
        <div class="text-left text-lg leading-tight pr-12" x-text="$store.{{ name }}.currentLayer?.sound_title"></div>
        {% if artist_url %}
            <!-- A locally-dropped studio track has no Sound row, so there is no
                 artist page to open — the button goes inert rather than posting
                 an id the server cannot resolve. -->
            <button type="button"
                    class="pointer-events-auto self-end text-right pb-1 pr-1 text-sm opacity-90 transition enabled:cursor-pointer enabled:hover:opacity-100 enabled:hover:underline"
                    x-text="$store.{{ name }}.currentLayer?.sound_artist"
                    :disabled="$store.{{ name }}.currentLayer?.isLocal"
                    title="View artist"
                    hx-get="{{ artist_url }}"
                    hx-swap="none"
                    :hx-vals="JSON.stringify({ sound_id: $store.{{ name }}.currentLayer?.sound_id })"></button>
        {% else %}
            <div class="self-end pb-1 pr-1 text-right text-sm opacity-90" x-text="$store.{{ name }}.currentLayer?.sound_artist">
            </div>
        {% endif %}
    </div>

</div>
