<div data-vote-action-layer class="flex h-full w-full flex-col items-center justify-center px-8 text-center transition-colors duration-300" :class="isUpvote ? 'bg-success text-success-content' : 'bg-error text-error-content'">
    <span class="material-symbols-outlined text-6xl" aria-hidden="true" x-text="isUpvote ? 'thumb_up' : 'thumb_down'"></span>
    <span class="mt-3 font-sans text-4xl font-semibold tracking-tight" x-text="voteLabel"></span>
    <span class="mt-2 text-sm font-medium opacity-75">Choose your vote, then submit it below.</span>
    {% if not request.user.is_authenticated %}
        <fieldset class="relative z-10 mt-6 flex w-full max-w-56 flex-col gap-2 text-left text-sm">
            <legend class="mb-2 text-center font-semibold">Vote as</legend>
            <label class="flex items-center gap-2"><input type="radio" name="vote_identity" class="radio radio-sm" :checked="voteAnonymously" @change="voteAnonymously = true"> Anonymous listener</label>
            <label class="flex items-center gap-2"><input type="radio" name="vote_identity" class="radio radio-sm" :checked="!voteAnonymously" @change="voteAnonymously = false"> Sign in</label>
        </fieldset>
    {% endif %}
    <span x-cloak x-show="voteError" x-text="voteError" role="alert" class="mt-4 max-w-64 rounded-full bg-black/60 px-4 py-2 text-xs font-semibold text-white"></span>
</div>
