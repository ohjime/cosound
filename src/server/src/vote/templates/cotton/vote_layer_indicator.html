<div class="join w-fit ring-4" rounded-none>
    <template x-for="(slide, index) in carouselSlides" :key="slide.key">
        <button type="button"
                class="font-mono join-item btn-sm btn btn-neutral h-7 rounded-none border-none"
                :class="['w-7.5', currentIndex === index ? '!text-white text-xl font-extrabold' : 'text-gray-300 text-xs font-light']"
                :aria-label="slide.ariaLabel"
                :aria-pressed="currentIndex === index"
                :style="`opacity: ${layerIndicatorOpacity(slide)}`"
                @click="select(index)"
                x-text="slide.indicatorLabel"></button>
    </template>
</div>
